# Versiones de capas que procesa el ETL (Parte 5). Cada versión es una carpeta en data/raw/<version>/
# con los shapefiles tal como los entrega el municipio. `null` = autodetectar.
# Para ver archivos, CRS, campos y nulos antes de fijar esto: pnpm etl:inspect -- --version <v>
versiones:
  # Entrega oficial del municipio (2025-03-05), CRS EPSG:32720 declarado en los .prj, encoding UTF-8.
  # Campos verificados con etl:inspect sobre la entrega real (2026-09-17):
  #   DM.shp  16 features    · FID_, DIS (sin nulos)
  #   UV.shp  582 features   · OBJECTID, DM, UV, Area_m2  (5 y 7 nulos en DM/UV; 3 geometrías nulas)
  #   MZ.shp  27 817 features· OBJECTID, DM, UV, Mz, CodigoManz, CodigoOrig (58 geometrías nulas)
  - version: DM_UV_MZ_2025
    carpeta: data/raw/DM_UV_MZ_2025
    fuente: "Gobierno Autónomo Municipal de Santa Cruz de la Sierra <a confirmar>"
    fecha_vigencia: null # <a confirmar>; los archivos son del 2025-03-05
    crs_origen: null # se lee del .prj: WGS_1984_UTM_Zone_20S = EPSG:32720
    encoding: null # .cpg declara UTF-8
    capas:
      distrito_municipal:
        archivo: DM.shp
        campos:
          codigo: DIS
          nombre: null # la capa no trae nombre de distrito
          plantilla_nombre: "Distrito {codigo}"
          respaldo: FID_
      unidad_vecinal:
        archivo: UV.shp
        campos:
          codigo: UV
          nombre: null # la capa no trae nombre de UV
          plantilla_nombre: "Unidad Vecinal {codigo}"
          distrito: DM
          respaldo: OBJECTID
      manzana:
        archivo: MZ.shp
        campos:
          # La capa de manzanas NO trae un identificador único. Medido sobre la entrega real:
          #   CodigoManz  4 300 de 27 817 filas con valor (4 146 distintos)
          #   Mz          19 012 con valor, 1 001 distintos: es el número dentro de la UV
          #   DM+UV+Mz    17 420 combinaciones distintas
          #   OBJECTID    20 001 distintos; vale 0 en 6 596 filas
          # Se usa OBJECTID por ser el que deja menos códigos sintéticos, y el ETL desambigua los
          # repetidos con un sufijo -2, -3… estable por orden de archivo. Quedan contados en
          # reporte_calidad.md como "codigo_repetido". La solución de fondo es que el municipio
          # entregue un código de manzana único; hasta entonces el id es un subrogado del ETL.
          codigo: OBJECTID
          nombre: null
          plantilla_nombre: "Manzana {codigo}"
          unidad_vecinal: UV
          distrito: DM
          respaldo: OBJECTID

  # Muestra SINTÉTICA generada por `pnpm --filter geodata-etl samples:generar` (en UTM 20S)
  - version: DM_UV_MZ_SAMPLE
    carpeta: data/samples/shp/DM_UV_MZ_SAMPLE
    fuente: "sintético — pipelines/geodata-etl samples:generar"
    fecha_vigencia: null
    crs_origen: null
    encoding: null
    capas:
      distrito_municipal:
        archivo: DM_SAMPLE.shp
        campos: { codigo: COD_DM, nombre: NOM_DM }
      unidad_vecinal:
        archivo: UV_SAMPLE.shp
        campos: { codigo: COD_UV, nombre: NOM_UV, distrito: COD_DM }
      manzana:
        archivo: MZ_SAMPLE.shp
        campos: { codigo: COD_MZ, nombre: null, unidad_vecinal: COD_UV, distrito: COD_DM }

# Tolerancias de simplificación en metros (CLAUDE.md §6.6)
simplificacion:
  distrito_municipal: 5
  unidad_vecinal: 4
  manzana: 2
umbral_teselas_bytes: 5242880

# Verificación de la reparación topológica (§6.4). Son DOS umbrales distintos a propósito:
#  - tolerancia_cambio_area: cambio del área TOTAL de la capa. Es el control duro; si se mueve,
#    la reparación creó o destruyó superficie y hay que mirarla.
#  - tolerancia_cambio_area_feature: cambio del área de UNA feature. Al resolver un solape el
#    área pasa de un polígono a su vecino: el total casi no varía y los dos implicados sí.
#    Con un único número, cualquier solape legítimo abortaba el ETL y obligaba a --forzar.
# El 1 % por feature busca detectar una geometría destrozada por `-clean`, no la redistribución
# normal. Todo cambio, pase o no el umbral, queda listado en reporte_calidad.md.
# <valor a confirmar con la primera corrida sobre los datos reales>
tolerancia_cambio_area: 0.001
tolerancia_cambio_area_feature: 0.01
