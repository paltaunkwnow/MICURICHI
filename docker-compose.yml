# Entorno de Mi Curichi con Docker. Parte 5.
#
# Una instalación por ciudad (decisión del 2026-09-26): la MISMA imagen y este mismo archivo sirven
# a cualquier ciudad; lo que cambia es el `.env` (bloque «Ciudad», credenciales) y las capas del ETL.
#
# Perfiles. Sin ninguno, `docker compose up -d` levanta solo PostgreSQL, que es lo que hace falta
# para desarrollar con `pnpm dev` en la máquina (ver README, «Arranque local con Docker»).
#
#   servicios       migraciones (job) → api-core y geo-service → web-ciudadano y panel-admin → proxy
#                   (Caddy: TLS y reparto; lo ÚNICO que publica puertos hacia fuera, 80 y 443)
#   minio           MinIO + su inicialización: S3 LOCAL para las fotos, solo desarrollo. En la VPS
#                   las fotos van al disco (volumen `fotos-data`), con guarda de espacio; un S3
#                   gestionado es la alternativa (docs/operaciones/produccion.md, «Fotos en producción»)
#   respaldos       respaldo diario cifrado a un S3 externo (docs/operaciones/respaldo-y-restauracion.md)
#   observabilidad  Prometheus, Alertmanager y blackbox (docs/operaciones/observabilidad.md)
#
#   docker compose --profile servicios --profile minio up -d --build      # la pila local entera
#
# VERIFICADO EN EJECUCIÓN (Fase 4, 2026-09-15): imágenes construidas, pila levantada, todos los
# healthchecks en `healthy`, migraciones aplicadas contra PostgreSQL 18.6 + PostGIS 3.6.4, y
# respaldo/restauración cronometrados. Lo que NO se ha podido probar sigue anotado en
# `infra/docker/README.md`.
name: mi-curichi

# Anclas comunes: los servicios de larga vida comparten política de logs y de reinicio.
x-comun: &comun
  restart: unless-stopped
  # Sin esto, el log de un contenedor crece sin límite hasta llenar el disco del host. Es el
  # fallo de operación más aburrido y más frecuente que existe.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # Reducción del radio de daño si alguien llega a ejecutar código dentro del contenedor.
  # `no-new-privileges`: ningún binario setuid puede escalar. Sin esto, un binario con el bit
  # puesto que llegara a la imagen serviría para volver a root dentro del contenedor.
  # El tope de procesos va en `deploy.resources.limits.pids` de cada servicio: Compose no acepta
  # `pids_limit` y `deploy` a la vez, y todos los servicios ya usan `deploy`.
  security_opt:
    - no-new-privileges:true

# Los servicios Node no escriben en su sistema de archivos: el código va en /app en solo lectura y
# lo único que necesitan escribir son los temporales. Con `read_only` y un tmpfs pequeño, una
# ejecución de código arbitrario no puede dejar nada persistente en la imagen.
#  - cap_drop ALL: Node no necesita ninguna capability de Linux. No abre puertos por debajo del
#    1024, no monta nada, no cambia de usuario. Quitarlas todas no rompe nada y elimina de golpe
#    los caminos de escape que dependen de CAP_SYS_ADMIN, CAP_DAC_OVERRIDE o CAP_CHOWN.
x-servicio-node: &servicio-node
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL

services:
  postgis:
    <<: *comun
    image: postgis/postgis:18-3.6
    container_name: curichi-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curichi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-curichi}
      # Contraseñas de los roles de aplicación con privilegios mínimos. Las lee
      # `infra/sql/01-roles.sh` al inicializar el volumen; sin ellas el init falla y el contenedor
      # no queda a medias fingiendo que está listo.
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Definir API_DB_PASSWORD en .env}
      GEO_DB_PASSWORD: ${GEO_DB_PASSWORD:?Definir GEO_DB_PASSWORD en .env}
    # Parámetros de arranque en vez de un postgresql.conf propio: son pocos y así se ven aquí.
    #  - max_connections: techo de conexiones. Cada réplica de api-core abre hasta DB_POOL_MAX
    #    y geo-service otras tantas; 100 deja sitio para unas diez réplicas más las sesiones de
    #    mantenimiento y psql. Subirlo no es gratis: cada conexión reserva memoria de trabajo,
    #    así que primero se ajusta el pool y solo después esto.
    #  - statement_timeout: ninguna consulta se queda colgada para siempre. 30 s es holgado para
    #    todo lo que hace la aplicación y corta las patológicas.
    #  - idle_in_transaction_session_timeout: una transacción abierta y olvidada bloquea el VACUUM
    #    de las tablas que tocó y retiene filas muertas indefinidamente.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - statement_timeout=30s
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - log_min_duration_statement=1000
    # /dev/shm del contenedor: Docker lo monta con 64 MB por defecto, y PostgreSQL usa memoria
    # compartida dinámica (dynamic_shared_memory_type = posix, el valor por defecto en Linux) en
    # /dev/shm para las consultas en paralelo. Con 64 MB se queda corto y la consulta falla con
    # «could not resize shared memory segment … No space left on device». 256m da margen; se ajusta
    # con POSTGRES_SHM_SIZE.
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    ports:
      # Solo loopback: publicar en 0.0.0.0 deja la base accesible desde toda la red local con la
      # contraseña de desarrollo. Para llegar desde otra máquina, un túnel SSH.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 mueve el directorio de datos: el volumen se monta en /var/lib/postgresql
      - postgis-data:/var/lib/postgresql
      # Solo extensiones (CLAUDE.md §5.1). Se ejecuta UNA vez, al crear el volumen.
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curichi} -d ${POSTGRES_DB:-curichi}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Una parada brusca deja el clúster en recuperación al arrancar; 30 s dan margen al
    # checkpoint de apagado.
    stop_grace_period: 30s
    # La base es el componente que limita, y por bastante. Medido en la Fase 4 con un millón de
    # reportes y el listado por bbox que pide el mapa:
    #
    #   postgis con 2 CPU →  21 rps (conc 10) ·  20 rps (conc 100), p95 5,9 s, 433 respuestas 503
    #   postgis con 6 CPU → 142 rps (conc 10) · 117 rps (conc 100), p95 1,7 s, ningún 503
    #
    # Mientras tanto api-core y geo-service estaban al 0,03 % de CPU. Es decir: el límite que
    # tenía puesto aquí ERA el cuello de botella, no la consulta ni el pool. Las métricas lo
    # confirmaron desde dentro: el 83 % del tiempo de cada petición se iba esperando a la base.
    #
    # 4.0 es un punto medio razonable en una máquina de desarrollo de 12 núcleos. En producción
    # este número sale del dimensionado real, no de aquí; lo que no hay que hacer es ahogar a la
    # base para "repartir" CPU entre servicios que están ociosos.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 1536M
          pids: 512

  # --- S3 local para las fotos (perfil `minio`) ---------------------------------------------------
  #
  # SOLO DESARROLLO. En la VPS las fotos van al disco (`fotos-data`); si algún día salen de ahí, a
  # un S3 gestionado, nunca a este MinIO. El porqué está en docs/operaciones/produccion.md.
  #
  # POR QUÉ ESTA IMAGEN. MinIO archivó su edición comunitaria (abril de 2026) y dejó de publicar
  # imágenes: `minio/minio` ya no está en Docker Hub y, desde el 24-09-2026, `quay.io/minio/minio`
  # responde 401 a las descargas anónimas (comprobado el 26-09-2026). La que usábamos
  # (RELEASE.2025-04-22) además no tenía el parche de CVE-2025-62506 (escalada de privilegios con
  # políticas de sesión), que llegó en RELEASE.2025-10-15T17-29-55Z. Esta es esa versión compilada
  # desde el código oficial por Coolify (etiqueta `org.opencontainers.image.revision` = commit
  # da2e68be de minio/minio), fijada por digest: una reconstrucción trae siempre los mismos bytes.
  # Trae `mc` dentro, así que `minio-init` usa la misma imagen.
  minio:
    <<: *comun
    profiles: ["minio"]
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    container_name: curichi-minio
    command: server /data --console-address ":9001"
    environment:
      # Las credenciales ROOT solo las usan este contenedor y `minio-init`. api-core usa un usuario
      # propio limitado a su bucket (S3_ACCESS_KEY / S3_SECRET_KEY), que crea `minio-init`.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-curichi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definir MINIO_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # `mc` viene en la propia imagen del servidor; no hace falta añadir curl.
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256

  minio-init:
    # Crea el bucket (privado) y el usuario de api-core con una política que solo alcanza a ese
    # bucket, y termina. Se niega a seguir si api-core fuese a usar la credencial root.
    profiles: ["minio"]
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    container_name: curichi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-curichi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definir MINIO_ROOT_PASSWORD en .env}
      S3_BUCKET: ${S3_BUCKET:-fotos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    entrypoint: ["/bin/sh", "/inicializar.sh"]
    volumes:
      - ./infra/minio/inicializar.sh:/inicializar.sh:ro
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # --- Servicios (perfil `servicios`) -------------------------------------------------------------
  #
  # Las imágenes se construyen aquí en local; en producción se usan las que publica el CI en GHCR
  # (tag = SHA del commit de `main`) poniendo IMAGEN_API_CORE, IMAGEN_GEO_SERVICE,
  # IMAGEN_WEB_CIUDADANO, IMAGEN_PANEL_ADMIN e IMAGEN_PROXY en el .env.
  #
  # Topología (docs/operaciones/produccion.md, «Topología»):
  #
  #   navegador ─HTTPS─▶ proxy ─▶ web-ciudadano / panel-admin ─▶ api-core ─▶ geo-service
  #                                      └──────────────────────▶ geo-service      │
  #                                                              postgis ◀─────────┘
  #
  # Los valores que dependen de ESA topología no se leen de las variables de `pnpm dev`
  # (TRUST_PROXY, PROXY_DE_CONFIANZA, COOKIE_SEGURA, CORS_ORIGENES, PANEL_ADMIN_URL, HSTS), que
  # comparten el mismo .env en una máquina de desarrollo y ahí valen otra cosa: se fijan aquí o se
  # derivan de DOMINIO_PUBLICO y DOMINIO_PANEL, con una variable `*_DOCKER` para casos especiales.
  #
  # Escalado: api-core y geo-service NO llevan `container_name` ni puerto fijo en la máquina, así
  # que `--scale api-core=3` funciona. Cada réplica publica un puerto efímero en 127.0.0.1
  # (`docker compose port api-core 3001` dice cuál) y, dentro de la red, el nombre del servicio
  # reparte entre réplicas. OJO: el rate limit por IP es por proceso; con N réplicas el límite
  # efectivo es N veces el configurado (docs/operaciones/produccion.md, «Varias réplicas»).

  # Job de migraciones: corre con la imagen de api-core y el rol DUEÑO, aplica las pendientes y
  # termina. api-core y geo-service no arrancan hasta que acabe BIEN (`service_completed_successfully`):
  # si una migración falla, el despliegue se detiene con los contenedores viejos en marcha en vez de
  # dejar servicios nuevos sobre un esquema viejo. Seguro con varias réplicas y en paralelo (advisory
  # lock). Un fallo con SQLSTATE 55P03 es tráfico (lock_timeout), no un error del SQL: reintentar.
  # La 0015 aborta si quedan reportes en «nuevo» (se enviaron con la promesa de revisión previa):
  # moderarlos antes o, a sabiendas, `docker compose --profile servicios run --rm migraciones node
  # node_modules/db/dist/cli/migrar.js --publicar-nuevos-existentes` (produccion.md, «Migración 0015»).
  migraciones:
    <<: [*comun, *servicio-node]
    profiles: ["servicios"]
    image: ${IMAGEN_API_CORE:-mi-curichi-api-core:local}
    restart: "no"
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      # Rol DUEÑO del esquema: es el único que puede crear tablas. Ningún servicio lo usa.
      # MIGRAR_BASE (solo desde la línea de órdenes) apunta el job a otra base del mismo servidor,
      # p. ej. la de una restauración: `MIGRAR_BASE=curichi_restaurada docker compose … run …`.
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-curichi}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}@postgis:5432/${MIGRAR_BASE:-${POSTGRES_DB:-curichi}}}
      - MIGRAR_LOCK_TIMEOUT_MS
      - CRS_METRICO_EPSG
    command: ["node", "node_modules/db/dist/cli/migrar.js"]
    # El HEALTHCHECK de la imagen pregunta por /health, que un job no tiene.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 64

  api-core:
    <<: [*comun, *servicio-node]
    profiles: ["servicios"]
    image: ${IMAGEN_API_CORE:-mi-curichi-api-core:local}
    build:
      context: .
      dockerfile: infra/docker/servicio.Dockerfile
      args:
        PAQUETE: api-core
        PUERTO: 3001
    depends_on:
      migraciones:
        condition: service_completed_successfully
      postgis:
        condition: service_healthy
      # `service_started` decía solo "el contenedor arrancó", que no es lo mismo que "responde":
      # api-core llama a geo-service en cada POST /reportes. Ahora espera a que esté sano.
      geo-service:
        condition: service_healthy
      # Solo si el perfil `minio` está activo (`required: false`). Con S3 en MinIO y MinIO todavía
      # arrancando, api-core se negaría a arrancar (comprueba el bucket antes de escuchar).
      minio-init:
        condition: service_completed_successfully
        required: false
    # Lista y no mapa a propósito: una entrada SIN valor (`- SESION_DIAS`) pasa la variable solo si
    # está definida en el .env y, si no, el servicio usa su valor por defecto. Con `CLAVE: ${X:-}`
    # llegaba una cadena vacía, y `Number("")` es 0: LOGIN_MAX_FALLOS_EMAIL vacío dejaba el freno
    # de fuerza bruta en cero intentos.
    environment:
      - NODE_ENV=production
      # Rol de aplicación, NO el dueño del esquema (migración 0008). Arrancar con el rol dueño o con
      # un superusuario está prohibido y el servicio lo comprueba al arrancar. Es la variable «de
      # dentro»: API_DATABASE_URL es la de `pnpm dev` y apunta a 127.0.0.1, que dentro del
      # contenedor es el propio contenedor.
      - DATABASE_URL=${API_DATABASE_URL_DOCKER:-postgresql://curichi_api:${API_DB_PASSWORD:?Definir API_DB_PASSWORD en .env}@postgis:5432/${POSTGRES_DB:-curichi}}
      - GEO_SERVICE_URL=http://geo-service:3002
      - API_CORE_PORT=3001
      # Ciudad de esta instalación (bloque «Ciudad» del .env). api-core la publica en
      # GET /api/v1/configuracion; sin definir, vale Santa Cruz.
      - CIUDAD_NOMBRE
      - CIUDAD_PAIS
      - CIUDAD_LOCALE
      - CIUDAD_CENTRO_LON
      - CIUDAD_CENTRO_LAT
      - CIUDAD_ZOOM_INICIAL
      - ZONA_HORARIA=${ZONA_HORARIA:-America/La_Paz}
      - CRS_METRICO_EPSG
      - DB_POOL_MAX=${DB_POOL_MAX:-8}
      - DB_STATEMENT_TIMEOUT_MS
      - DB_IDLE_TX_TIMEOUT_MS
      - DB_ESPERA_CONEXION_MS
      # Las sales y los tokens NO tienen valor por defecto a propósito: el servicio (que aquí corre
      # con NODE_ENV=production) se niega a arrancar sin ellos, con el de ejemplo o con menos de 32
      # caracteres, y dice cuál falta (config.ts). No llevan `:?`: un `:?` rompe TODO el Compose,
      # también `docker compose up -d postgis` en un clon recién hecho, aunque no se use este perfil.
      - IP_HASH_SAL
      - JITTER_SAL
      # Obligatorio en producción: api-core lo manda en cada POST /geo/v1/resolver y en la
      # invalidación de capas; con él, geo-service saca esas llamadas del cupo por IP.
      - GEO_TOKEN_INTERNO
      # Los dos van juntos: o se expone /metrics CON token, o se deja la ruta vacía.
      - METRICAS_RUTA=${METRICAS_RUTA-/metrics}
      - METRICAS_TOKEN=${METRICAS_TOKEN:-}
      # Los orígenes públicos de las dos apps. El navegador no llama a api-core de otro origen (va
      # por /api en el suyo y la app reenvía), pero en producción no puede quedar vacío ni en `*`.
      - CORS_ORIGENES=${CORS_ORIGENES_DOCKER:-https://${DOMINIO_PUBLICO:-localhost},https://${DOMINIO_PANEL:-localhost}}
      # Fijo: con NODE_ENV=production api-core no arranca sin él, y detrás del proxy hay HTTPS.
      - COOKIE_SEGURA=1
      # Adónde lleva el botón «Panel técnico» (va en /auth/yo). Obligatoria y https en producción.
      - PANEL_ADMIN_URL=${PANEL_ADMIN_URL_DOCKER:-https://${DOMINIO_PANEL:-}}
      # 1 = un salto de confianza: el socket es la app Next y la última entrada de X-Forwarded-For
      # la escribió el proxy con la IP real. Next no añade entrada propia. NO 2: la penúltima la
      # elige el cliente. Cadena completa en produccion.md, «La IP del cliente».
      - TRUST_PROXY=${TRUST_PROXY_DOCKER:-1}
      - PUBLIC_BASE_URL
      - EXPONER_DOCS
      - SESION_DIAS
      - SESION_IDLE_HORAS
      # Cupo por cuenta y por día calendario en ZONA_HORARIA, contado en la base (vale igual con N
      # réplicas), y tope diario de altas por IP. Sin definir valen los del contrato (3, 12 y 10).
      - REPORTES_POR_DIA_POR_CUENTA
      - FOTOS_POR_DIA_POR_CUENTA
      - ALTAS_POR_DIA_POR_IP
      # SOLO PARA PRUEBAS (0 a 3600 s): la demora de publicación de un reporte. En producción NO se
      # definen y valen las del contrato, 60 s el 1.º del día y 240 s los siguientes (ADR 0006).
      # Las pone la pila de E2E para no esperar minutos por reporte.
      - REPORTE_DEMORA_PRIMERO_S
      - REPORTE_DEMORA_SIGUIENTES_S
      # Guarda de disco de las fotos (solo sin S3): por debajo de este espacio libre, POST /fotos da
      # 507 SIN_ESPACIO y /ready sale degradado. El disco es el mismo que el de PostgreSQL. api-core
      # publica el umbral en /metrics y las alertas DiscoDeFotos* lo leen de ahí.
      - FOTOS_MIN_LIBRE_BYTES=${FOTOS_MIN_LIBRE_BYTES:-2147483648}
      # Límites ajustables sin reconstruir la imagen.
      - RATE_LIMIT_REPORTES_POR_HORA=${RATE_LIMIT_REPORTES_POR_HORA:-10}
      - RATE_LIMIT_LECTURAS_POR_MINUTO=${RATE_LIMIT_LECTURAS_POR_MINUTO:-240}
      - LOGIN_PETICIONES_POR_VENTANA=${LOGIN_PETICIONES_POR_VENTANA:-20}
      - LOGIN_MAX_FALLOS_EMAIL
      - LOGIN_MAX_FALLOS_IP
      - LOGIN_VENTANA_MINUTOS
      - REGISTRO_PETICIONES_POR_VENTANA
      - REGISTRO_MAX_POR_IP
      - REGISTRO_VENTANA_MINUTOS
      - IP_HASH_RETENCION_DIAS
      - PASSWORD_WORKERS=${PASSWORD_WORKERS:-2}
      - PASSWORD_COLA_MAX
      - CIERRE_PLAZO_MS
      - MANTENIMIENTO_ESPERA_MS
      # Almacén de fotos. Sin `S3_ENDPOINT_DOCKER`, api-core usa `STORAGE_DIR` (el volumen de
      # abajo, que comparten las réplicas de ESTA máquina): es el modo oficial en la VPS (ADR 0006),
      # con la guarda FOTOS_MIN_LIBRE_BYTES. Con `S3_ENDPOINT_DOCKER=http://minio:9000` (local) o la
      # URL de un S3 gestionado, las fotos van a S3.
      - STORAGE_DIR=/datos/fotos
      - S3_ENDPOINT=${S3_ENDPOINT_DOCKER:-}
      - S3_BUCKET=${S3_BUCKET:-fotos}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ESTILO_RUTA=${S3_ESTILO_RUTA:-1}
      - S3_PLAZO_MS
    volumes:
      # La imagen crea /datos/fotos con dueño `node`, así que un volumen nuevo nace con ese dueño.
      - fotos-data:/datos/fotos
    ports:
      # Puerto efímero en loopback: permite `--scale` y no choca con `pnpm dev` (3001).
      - "127.0.0.1::3001"
    # Node cierra el servidor y el pool al recibir SIGTERM; 20 s le sobran y evitan el SIGKILL a
    # los 10 s por defecto, que corta peticiones en vuelo.
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M
          pids: 512

  geo-service:
    <<: [*comun, *servicio-node]
    profiles: ["servicios"]
    image: ${IMAGEN_GEO_SERVICE:-mi-curichi-geo-service:local}
    build:
      context: .
      dockerfile: infra/docker/servicio.Dockerfile
      args:
        PAQUETE: geo-service
        PUERTO: 3002
    depends_on:
      migraciones:
        condition: service_completed_successfully
      postgis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      # Solo lectura (§4.6). El servicio comprueba al arrancar que este rol NO puede escribir en
      # reporte_inundacion y en producción se niega a servir si puede.
      - DATABASE_URL=${GEO_DATABASE_URL_DOCKER:-postgresql://curichi_geo:${GEO_DB_PASSWORD:?Definir GEO_DB_PASSWORD en .env}@postgis:5432/${POSTGRES_DB:-curichi}}
      - GEO_SERVICE_PORT=3002
      - DB_POOL_MAX=${DB_POOL_MAX:-8}
      - GEO_DB_STATEMENT_TIMEOUT_MS
      # Obligatorio en producción, el mismo valor que en api-core.
      - GEO_TOKEN_INTERNO
      # geo-service también registra `ipHash` en cada petición: sin la sal propia, el hash sería
      # adivinable con el valor de ejemplo.
      - IP_HASH_SAL
      - METRICAS_RUTA=${METRICAS_RUTA-/metrics}
      - METRICAS_TOKEN=${METRICAS_TOKEN:-}
      - CORS_ORIGENES=${CORS_ORIGENES_DOCKER:-https://${DOMINIO_PUBLICO:-localhost},https://${DOMINIO_PANEL:-localhost}}
      # Igual que api-core: le llega /geo/* desde las apps, con la IP real escrita por el proxy. Las
      # llamadas de api-core no traen X-Forwarded-For y cuentan con la IP de api-core (y el token).
      - TRUST_PROXY=${TRUST_PROXY_DOCKER:-1}
      - GEO_RATE_LIMIT_POR_MINUTO=${GEO_RATE_LIMIT_POR_MINUTO:-600}
      - GEO_RATE_LIMIT_CONSULTAS_POR_MINUTO=${GEO_RATE_LIMIT_CONSULTAS_POR_MINUTO:-120}
      # Cifras por UV y puntos críticos: vida de la caché y edad máxima de lo que se sirve. Sin
      # definir, valen las de geo-service (el plan fija 100 s y 120 s: cifras con 2 min como máximo).
      - GEO_CACHE_AGREGADOS_MS
      - GEO_CACHE_AGREGADOS_EDAD_MAX_MS
      - UMBRAL_TESELAS_BYTES
      - TOLERANCIA_SIMPLIFICACION
      - CIERRE_PLAZO_MS
      # Solo lectura: geo-service sirve las capas que genera el ETL, nunca las escribe (§4.6).
      - DIR_PROCESSED=/datos/processed
    volumes:
      - ./data/processed:/datos/processed:ro
    ports:
      - "127.0.0.1::3002"
    stop_grace_period: 20s
    # Más memoria que api-core: el índice de teselas de la capa de manzanas vive en el proceso.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
          pids: 512

  # --- Apps Next (perfil `servicios`) --------------------------------------------------------------
  #
  # Una imagen por app (infra/docker/app.Dockerfile) que sirve a cualquier ciudad: todo lo de esta
  # instalación llega por entorno y la ciudad, de api-core. Sin `container_name` ni puertos: solo
  # las alcanza el proxy, y `--scale web-ciudadano=3` funciona (el proxy reparte por DNS).
  #
  # PROXY_DE_CONFIANZA=1 FIJO, y es seguro justamente porque no publican puertos: la única forma de
  # llegar a ellas es a través del proxy, que reescribe X-Forwarded-For con la IP real. Con 0,
  # `src/proxy.ts` borraría esa cabecera y api-core vería a todos los vecinos con la IP de la app:
  # el límite de 10 reportes por hora pasaría a ser de la ciudad entera.
  # HSTS=0 FIJO: lo pone el proxy, que es quien sabe si hay certificados públicos (PROXY_TLS=acme).
  web-ciudadano:
    <<: [*comun, *servicio-node]
    profiles: ["servicios"]
    image: ${IMAGEN_WEB_CIUDADANO:-mi-curichi-web-ciudadano:local}
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP: web-ciudadano
        PUERTO: 3000
    depends_on:
      api-core:
        condition: service_healthy
      geo-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Por el nombre del servicio: con réplicas, el DNS de Docker reparte por conexión.
      - API_CORE_URL=http://api-core:3001
      - GEO_SERVICE_URL=http://geo-service:3002
      - PROXY_DE_CONFIANZA=1
      - HSTS=0
    # Solo lectura como los servicios; `.next/cache` es lo único donde Next escribiría.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/web-ciudadano/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256

  panel-admin:
    <<: [*comun, *servicio-node]
    profiles: ["servicios"]
    image: ${IMAGEN_PANEL_ADMIN:-mi-curichi-panel-admin:local}
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP: panel-admin
        PUERTO: 3100
    depends_on:
      api-core:
        condition: service_healthy
      geo-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3100
      - HOSTNAME=0.0.0.0
      - API_CORE_URL=http://api-core:3001
      - GEO_SERVICE_URL=http://geo-service:3002
      - PROXY_DE_CONFIANZA=1
      - HSTS=0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/panel-admin/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256

  # --- Proxy de entrada (perfil `servicios`) -------------------------------------------------------
  #
  # Caddy con la configuración horneada (infra/proxy/Caddyfile, infra/docker/proxy.Dockerfile).
  # Termina TLS, reescribe X-Forwarded-For con la IP real, quita `x-middleware-rewrite`, pone HSTS
  # con certificados públicos y reparte entre las réplicas de las apps por DNS.
  #
  #   DOMINIO_PUBLICO, DOMINIO_PANEL  nombres distintos, apuntando (DNS) a esta máquina
  #   PROXY_TLS   acme (certificados públicos, por defecto) · interno (CA propia) · no (HTTP)
  #   ACME_EMAIL  obligatorio con acme
  #
  # Sin `:?`: el propio contenedor valida y se niega a arrancar con la lista de lo que falta.
  proxy:
    <<: *comun
    profiles: ["servicios"]
    image: ${IMAGEN_PROXY:-mi-curichi-proxy:local}
    build:
      context: ./infra
      dockerfile: docker/proxy.Dockerfile
    depends_on:
      web-ciudadano:
        condition: service_healthy
      panel-admin:
        condition: service_healthy
    environment:
      - DOMINIO_PUBLICO
      - DOMINIO_PANEL
      - ACME_EMAIL
      - PROXY_TLS=${PROXY_TLS:-acme}
    ports:
      # Caddy escucha en 8080/8443 sin root. Para probar en una máquina con 80/443 ocupados o sin
      # exponerse a la red: PROXY_PUERTO_HTTP=127.0.0.1:8080, PROXY_PUERTO_HTTPS=127.0.0.1:8443.
      - "${PROXY_PUERTO_HTTP:-80}:8080"
      - "${PROXY_PUERTO_HTTPS:-443}:8443"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      # Caddy no guarda configuración (persist_config off); /config existe pero queda vacía.
      - /config:rw,noexec,nosuid,size=1m,uid=10001,gid=10001
    cap_drop:
      - ALL
    volumes:
      # Certificados, cuenta ACME y CA interna. Tiene que sobrevivir a los reinicios: sin él, cada
      # arranque pide certificados nuevos y Let's Encrypt limita cuántos se pueden pedir por semana.
      - proxy-datos:/data
    # Caddy cierra ordenadamente con `grace_period 20s`.
    stop_grace_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 256

  # --- Respaldos (perfil `respaldos`) -------------------------------------------------------------
  #
  # pg_dump diario → cifrado (gpg, AES-256) → S3 EXTERNO con retención 7 diarios / 4 semanales /
  # 12 mensuales. Junto a cada respaldo sube un manifiesto con la última migración aplicada (el
  # respaldo excluye `_migraciones`) y el número de filas de cada tabla. Al arrancar hace uno en el
  # acto: así una credencial mal puesta se ve al desplegar y no a las 3 de la mañana.
  # Procedimiento completo y restauración: docs/operaciones/respaldo-y-restauracion.md.
  respaldo:
    <<: *comun
    profiles: ["respaldos"]
    image: mi-curichi-respaldo:local
    build:
      context: ./infra
      dockerfile: docker/respaldo.Dockerfile
    # tini como PID 1: reenvía SIGTERM al script, que está durmiendo hasta el próximo respaldo.
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - TZ=${ZONA_HORARIA:-America/La_Paz}
      - INSTALACION_NOMBRE=${INSTALACION_NOMBRE:-mi-curichi}
      # Rol dueño: el que puede leer todas las tablas. Misma variable que el job de migraciones.
      - RESPALDO_DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-curichi}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}@postgis:5432/${POSTGRES_DB:-curichi}}
      # Sin `:?` a propósito: una variable obligatoria de un perfil inactivo rompería
      # `docker compose up` para todo el mundo. Las valida el propio script al arrancar.
      - RESPALDO_CLAVE_CIFRADO
      - RESPALDO_S3_ENDPOINT
      - RESPALDO_S3_REGION
      - RESPALDO_S3_BUCKET
      - RESPALDO_S3_ACCESS_KEY
      - RESPALDO_S3_SECRET_KEY
      - RESPALDO_S3_PROVEEDOR
      - RESPALDO_S3_ESTILO_RUTA
      - RESPALDO_S3_PREFIJO
      - RESPALDO_HORA
      - RESPALDO_AL_ARRANCAR
      - RESPALDO_RETENCION_DIARIA
      - RESPALDO_RETENCION_SEMANAL
      - RESPALDO_RETENCION_MENSUAL
      - RESPALDO_URL_LATIDO
      - RESPALDO_ALERTMANAGER_URL
    volumes:
      # Directorio de trabajo del dump antes de cifrarlo. En disco y no en tmpfs: la base crece.
      - respaldo-trabajo:/trabajo
    healthcheck:
      # «unhealthy» si el último respaldo bueno tiene más de 26 h.
      test: ["CMD", "curichi-respaldo", "salud"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 30m
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128

  # --- Monitoreo (perfil `observabilidad`) --------------------------------------------------------
  #
  # Prometheus lee /metrics de TODAS las réplicas (descubrimiento por DNS del nombre del servicio)
  # con el token de METRICAS_TOKEN, el blackbox prueba /ready de cada réplica y Alertmanager manda
  # las alertas al webhook de ALERTAS_WEBHOOK_URL. Reglas: infra/observabilidad/alertas.yml.
  # Las dos interfaces web quedan en loopback: para verlas desde fuera, un túnel SSH.
  prometheus:
    <<: *comun
    profiles: ["observabilidad"]
    image: quay.io/prometheus/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    # Un envoltorio mínimo: escribe el token en un tmpfs (Prometheus no lee variables de entorno
    # en su configuración) y pone el nombre de la instalación en las etiquetas externas.
    entrypoint: ["/bin/sh", "/etc/prometheus/arrancar.sh"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    cap_drop:
      - ALL
    environment:
      - METRICAS_TOKEN
      - INSTALACION_NOMBRE=${INSTALACION_NOMBRE:-mi-curichi}
      - PROMETHEUS_RETENCION=${PROMETHEUS_RETENCION:-30d}
      - PROMETHEUS_RETENCION_TAMANO=${PROMETHEUS_RETENCION_TAMANO:-5GB}
      # Los mismos que el proxy: el job `proxy` entra por él con el nombre de cada sitio y el
      # módulo del blackbox que corresponde al modo TLS (infra/observabilidad/prometheus.yml).
      - DOMINIO_PUBLICO
      - DOMINIO_PANEL
      - PROXY_TLS=${PROXY_TLS:-acme}
    volumes:
      - ./infra/observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observabilidad/alertas.yml:/etc/prometheus/alertas.yml:ro
      - ./infra/observabilidad/arrancar-prometheus.sh:/etc/prometheus/arrancar.sh:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
          pids: 256

  alertmanager:
    <<: *comun
    profiles: ["observabilidad"]
    image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    entrypoint: ["/bin/sh", "/etc/alertmanager/arrancar.sh"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    cap_drop:
      - ALL
    environment:
      # [SENSIBLE] La URL de un webhook suele llevar el secreto dentro. Vacía = las alertas se ven
      # en la interfaz de Alertmanager pero no salen de la máquina (y el arranque lo avisa).
      - ALERTAS_WEBHOOK_URL
      - ALERTAS_URL_EXTERNA
    volumes:
      - ./infra/observabilidad/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./infra/observabilidad/alertmanager-sin-destino.yml:/etc/alertmanager/sin-destino.yml:ro
      - ./infra/observabilidad/arrancar-alertmanager.sh:/etc/alertmanager/arrancar.sh:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128

  blackbox:
    <<: *comun
    profiles: ["observabilidad"]
    image: quay.io/prometheus/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    # La imagen corre como root; para sondas HTTP no hace falta (sí para ICMP, que no se usa).
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./infra/observabilidad/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64

volumes:
  postgis-data:
  minio-data:
  fotos-data:
  proxy-datos:
  respaldo-trabajo:
  prometheus-data:
  alertmanager-data:
