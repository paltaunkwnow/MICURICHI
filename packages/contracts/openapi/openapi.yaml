                - alta
                - critica
            - type: "null"
      required:
        - unidad_vecinal_id
        - codigo
        - nombre
        - distrito_id
        - n_reportes
        - n_puntos_criticos
        - severidad_max
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: curichi_sesion
paths:
  /api/v1/reportes:
    post:
      summary: Crear un reporte (público, con rate limit y honeypot)
      tags:
        - reportes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReporteCrear"
      responses:
        "201":
          description: Reporte creado en estado nuevo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteFeature"
        "400":
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "422":
          description: "FUERA_DE_COBERTURA: el punto no cae en el municipio"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "429":
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
    get:
      summary: "Listar reportes (público: solo validados/resueltos con jitter;
        técnico: todos, exactos)"
      tags:
        - reportes
      parameters:
        - name: pagina
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: limite
          in: query
          required: false
          schema:
            default: 100
            type: integer
            minimum: 1
            maximum: 500
        - name: bbox
          in: query
          required: false
          schema:
            description: minLon,minLat,maxLon,maxLat
            type: string
            pattern: ^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$
        - name: estado
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - nuevo
                  - validado
                  - duplicado
                  - rechazado
                  - resuelto
              - type: array
                items:
                  type: string
                  enum:
                    - nuevo
                    - validado
                    - duplicado
                    - rechazado
                    - resuelto
              - type: string
        - name: severidad
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - baja
                  - media
                  - alta
                  - critica
              - type: array
                items:
                  type: string
                  enum:
                    - baja
                    - media
                    - alta
                    - critica
              - type: string
        - name: distrito_id
          in: query
          required: false
          schema:
            type: string
        - name: unidad_vecinal_id
          in: query
          required: false
          schema:
            type: string
        - name: punto_critico_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
      responses:
        "200":
          description: FeatureCollection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteFeatureCollection"
  /api/v1/reportes/{id}:
    get:
      summary: Detalle de un reporte
      tags:
        - reportes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Feature (propiedades técnicas si hay sesión de técnico/admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteFeature"
        "404":
          description: No existe o no es público
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/reportes/{id}/estado:
    patch:
      summary: Cambiar estado (máquina de estados §7.3)
      tags:
        - reportes
      security: &a1
        - cookieSesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReporteCambiarEstado"
      responses:
        "200":
          description: Reporte actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteTecnico"
        "409":
          description: Transición no permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/reportes/{id}/severidad:
    patch:
      summary: Reclasificar severidad (manual) o volver a la calculada
      tags:
        - reportes
      security: *a1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReporteReclasificar"
      responses:
        "200":
          description: Reporte actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteTecnico"
  /api/v1/reportes/{id}/fusionar:
    post:
      summary: Marcar como duplicado de un reporte canónico
      tags:
        - reportes
      security: *a1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReporteFusionar"
      responses:
        "200":
          description: Reporte marcado como duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteTecnico"
  /api/v1/fotos:
    post:
      summary: Subir una foto (multipart). Se reprocesa y se eliminan metadatos EXIF
        antes de guardarla.
      tags:
        - fotos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Foto guardada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FotoSubida"
        "413":
          description: Archivo demasiado grande
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "415":
          description: Tipo no permitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/fotos/{key}:
    get:
      summary: Servir una foto ya sanitizada
      tags:
        - fotos
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Imagen
  /api/v1/exportar:
    get:
      summary: Exportar CSV o GeoJSON con nota metodológica
      tags:
        - admin
      security: *a1
      parameters:
        - name: pagina
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: limite
          in: query
          required: false
          schema:
            default: 10000
            type: integer
            minimum: 1
            maximum: 50000
        - name: bbox
          in: query
          required: false
          schema:
            description: minLon,minLat,maxLon,maxLat
            type: string
            pattern: ^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$
        - name: estado
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - nuevo
                  - validado
                  - duplicado
                  - rechazado
                  - resuelto
              - type: array
                items:
                  type: string
                  enum:
                    - nuevo
                    - validado
                    - duplicado
                    - rechazado
                    - resuelto
              - type: string
        - name: severidad
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - baja
                  - media
                  - alta
                  - critica
              - type: array
                items:
                  type: string
                  enum:
                    - baja
                    - media
                    - alta
                    - critica
              - type: string
        - name: distrito_id
          in: query
          required: false
          schema:
            type: string
        - name: unidad_vecinal_id
          in: query
          required: false
          schema:
            type: string
        - name: punto_critico_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        - name: formato
          in: query
          required: false
          schema:
            default: geojson
            type: string
            enum:
              - csv
              - geojson
      responses:
        "200":
          description: Archivo
  /api/v1/indicadores:
    get:
      summary: Indicadores básicos
      tags:
        - admin
      security: *a1
      responses:
        "200":
          description: Indicadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indicadores"
  /api/v1/auth/login:
    post:
      summary: Iniciar sesión (técnico/admin)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Sesión creada (cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/auth/logout:
    post:
      summary: Cerrar sesión
      tags:
        - auth
      security: *a1
      responses:
        "204":
          description: Sesión cerrada
  /api/v1/auth/yo:
    get:
      summary: Usuario de la sesión
      tags:
        - auth
      security: *a1
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/admin/capas:
    get:
      summary: Versiones de capas cargadas
      tags:
        - admin
      security: *a1
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapaVersion"
  /api/v1/admin/capas/{id}/activar:
    post:
      summary: Activar una versión de capa como vigente
      tags:
        - admin
      security: *a1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapaVersion"
  /geo/v1/resolver:
    post:
      summary: "Point-in-polygon: distrito, UV y manzana de un punto (§7.4)"
      tags:
        - geo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolverEntrada"
      responses:
        "200":
          description: Resolución
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolverRespuesta"
  /geo/v1/capas/vigentes:
    get:
      summary: Versión vigente por capa
      tags:
        - geo
      responses:
        "200":
          description: Mapa capa → versión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapasVigentes"
  /geo/v1/capas:
    get:
      summary: Información de las capas vigentes (modo GeoJSON o teselas)
      tags:
        - geo
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapaInfo"
  /geo/v1/capas/{capa}:
    get:
      summary: GeoJSON web de la capa vigente (413 si debe consumirse por teselas)
      tags:
        - geo
      parameters:
        - name: capa
          in: path
          required: true
          schema:
            type: string
            enum:
              - distrito_municipal
              - unidad_vecinal
              - manzana
      responses:
        "200":
          description: FeatureCollection
        "413":
          description: Usar teselas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /geo/v1/teselas/{capa}/{z}/{x}/{y}.mvt:
    get:
      summary: Teselas vectoriales generadas al vuelo desde la capa vigente
      tags:
        - geo
      parameters:
        - name: capa
          in: path
          required: true
          schema:
            type: string
        - name: z
          in: path
          required: true
          schema:
            type: integer
        - name: x
          in: path
          required: true
          schema:
            type: integer
        - name: y
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: application/vnd.mapbox-vector-tile
        "204":
          description: Tesela vacía
  /geo/v1/agregados/unidades-vecinales:
    get:
      summary: Reportes validados por UV
      tags:
        - geo
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgregadoUv"
  /geo/v1/puntos-criticos:
    get:
      summary: Puntos críticos (§9.2)
      tags:
        - geo
      parameters:
        - name: bbox
          in: query
          required: false
          schema:
            type: string
          description: minLon,minLat,maxLon,maxLat
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PuntoCritico"
  /health:
    get:
      summary: Liveness
      tags:
        - admin
      responses:
        "200":
          description: ok
  /ready:
    get:
      summary: Readiness (base de datos y dependencias)
      tags:
        - admin
      responses:
        "200":
          description: listo
        "503":
          description: no listo
