  /api/v1/fotos:
    post:
      summary: "Subir una foto (multipart). EXIGE SESIÓN, igual que crear el reporte
        al que va pegada. Entra JPEG, PNG o WebP, reconocidos por su contenido y
        no por la extensión, y se guarda siempre en WebP (calidad 80), con 1600
        px por lado como máximo y sin metadatos: el servidor la vuelve a
        codificar y descarta EXIF (incluida la posición GPS), XMP y el perfil
        ICC. De una imagen animada queda solo el primer cuadro. Hasta que su
        autor la asocia a un reporte, una foto sin reporte solo la ve quien la
        subió."
      tags:
        - fotos
      security: *a1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Foto guardada en image/webp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FotoSubida"
        "400":
          description: "SIN_ARCHIVO: falta la imagen en el campo archivo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "401":
          description: SIN_SESION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "413":
          description: "ARCHIVO_GRANDE: archivo demasiado grande"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "415":
          description: TIPO_NO_PERMITIDO (solo JPEG, PNG o WebP) o IMAGEN_INVALIDA (no se
            pudo leer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "429":
          description: "CUOTA_DE_FOTOS: 12 fotos por cuenta y por día calendario en la
            zona horaria de la ciudad, reservadas antes de procesar y devueltas
            si el procesamiento falla; Retry-After hasta la próxima medianoche
            local. O límite por IP"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "507":
          description: "SIN_ESPACIO: con las fotos en disco, queda menos que
            FOTOS_MIN_LIBRE_BYTES libre. Se responde antes de procesar la imagen
            y sin gastar cupo; /ready queda degradado (fotos: poco_espacio). Las
            fotos comparten disco con PostgreSQL en la VPS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/fotos/{key}:
    get:
      summary: "Servir una foto ya sanitizada. Quién la ve: la de un reporte publicado
        (nuevo como «NO SE HA VERIFICADO», validado como «Verificado» y resuelto
        como «Resuelto», solo con publicar_en <= now(); rechazado y duplicado no
        se publican), cualquiera, con public, no-cache y ETag, y la visibilidad
        se comprueba antes de responder 304; las fotos de reportes sin verificar
        se ven en público junto con el reporte. El autor del reporte ve las
        suyas en cualquier estado (esperando su publicar_en, rechazado o
        duplicado), con private, no-store. Técnico y admin ven, con private,
        no-store, las fotos de un reporte ya publicado que después se rechazó o
        se fusionó (rechazado o duplicado), para moderarlo; una foto sin reporte
        solo la ve quien la subió, técnicos incluidos afuera, y la de un reporte
        que todavía espera su publicar_en no la ve nadie más que el autor,
        tampoco técnicos ni admin. A cualquier otro se le responde 404 con
        no-store, igual que si no existiera."
      tags:
        - fotos
      security:
        - {}
        - cookieSesion: []
      parameters:
        - name: key
          in: path
          required: true
          description: "Clave devuelta por POST /fotos: un uuid con .webp, o con .jpg para
            las fotos anteriores"
          schema:
            type: string
            pattern: ^[a-f0-9-]{36}\.(webp|jpg)$
      responses:
        "200":
          description: "La imagen: image/webp para las fotos nuevas, image/jpeg solo para
            las fotos anteriores a 0.8.0, que no se reconvierten"
          headers:
            Cache-Control:
              description: "public, no-cache si el reporte está publicado: cualquier caché la
                guarda pero la revalida con ETag en cada uso, así que retirar el
                reporte la retira también de las cachés compartidas (con max-age
                la seguirían sirviendo). private, no-store en los tres casos
                privados: el autor, con sus fotos en cualquier estado; técnico y
                admin, con la foto de un reporte publicado que después quedó
                rechazado o duplicado; y el dueño de una foto sin reporte."
              schema:
                type: string
            ETag:
              description: Solo en las fotos de reportes publicados; If-None-Match con el
                mismo valor da 304 si la foto sigue visible
              schema:
                type: string
            X-Content-Type-Options:
              description: nosniff
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: La foto no cambió (If-None-Match) y sigue visible. Una foto de un
            reporte retirado da 404, no 304
        "404":
          description: "NO_EXISTE: la foto no existe o quien pregunta no puede verla
            (Cache-Control: no-store)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "429":
          description: Demasiadas lecturas desde la misma IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/exportar:
    get:
      summary: Exportar CSV o GeoJSON con nota metodológica, en la vista técnica, solo
        con reportes ya publicados (publicar_en <= now()). Hasta 50000 filas por
        archivo (limite); si la selección tiene más, la respuesta lo declara con
        total, exportados y truncado en vez de recortar en silencio.
      tags:
        - admin
      security: *a1
      parameters:
        - name: pagina
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: limite
          in: query
          required: false
          schema:
            default: 50000
            type: integer
            minimum: 1
            maximum: 50000
        - name: bbox
          in: query
          required: false
          schema:
            description: minLon,minLat,maxLon,maxLat
            type: string
            pattern: ^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$
        - name: estado
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - nuevo
                  - validado
                  - duplicado
                  - rechazado
                  - resuelto
              - type: array
                items:
                  type: string
                  enum:
                    - nuevo
                    - validado
                    - duplicado
                    - rechazado
                    - resuelto
              - type: string
        - name: severidad
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - baja
                  - media
                  - alta
                  - critica
              - type: array
                items:
                  type: string
                  enum:
                    - baja
                    - media
                    - alta
                    - critica
              - type: string
        - name: distrito_id
          in: query
          required: false
          schema:
            type: string
        - name: unidad_vecinal_id
          in: query
          required: false
          schema:
            type: string
        - name: punto_critico_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        - name: formato
          in: query
          required: false
          schema:
            default: geojson
            type: string
            enum:
              - csv
              - geojson
      responses:
        "200":
          description: "Archivo (Content-Disposition: attachment)"
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/ExportacionGeoJson"
            text/csv:
              schema:
                type: string
        "400":
          description: "FILTROS_INVALIDOS: p. ej. limite fuera de rango"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "401":
          description: SIN_SESION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "403":
          description: SIN_PERMISO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/indicadores:
    get:
      summary: "Indicadores básicos, solo con reportes ya publicados (publicar_en <=
        now()). Los filtros opcionales severidad (lista, sobre la severidad
        efectiva) y distrito_id acotan las tortas del panel: total,
        por_distrito, por_unidad_vecinal, por_severidad y por_estado cuentan el
        subconjunto filtrado; puntos_criticos_recurrentes solo se filtra por
        distrito_id."
      tags:
        - admin
      security: *a1
      parameters:
        - name: severidad
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - baja
                  - media
                  - alta
                  - critica
              - type: array
                items:
                  type: string
                  enum:
                    - baja
                    - media
                    - alta
                    - critica
              - type: string
        - name: distrito_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Indicadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indicadores"
        "400":
          description: "FILTROS_INVALIDOS: severidad fuera de baja/media/alta/critica"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/ejecutivo/resumen:
    get:
      summary: Resumen del panel ejecutivo. Exige rol ejecutivo, tecnico o admin.
        Inundación activa = reportes en nuevo (en revisión) o validado
        (verificadas), con su severidad efectiva; los resueltos cuentan aparte
        (resueltas, por_estado) como trabajo hecho. Por distrito,
        en_capa_vigente separa los que solo existen en una capa anterior.
        ultimo_reporte_en va truncado al minuto. Solo cuenta reportes ya
        publicados (publicar_en <= now()).
      tags:
        - ejecutivo
      security: *a1
      parameters:
        - name: ventana
          in: query
          required: false
          schema:
            default: todo
            type: string
            enum:
              - 7d
              - 30d
              - todo
      responses:
        "200":
          description: Resumen ejecutivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenEjecutivo"
        "401":
          description: SIN_SESION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "403":
          description: "SIN_PERMISO: el rol no permite el panel ejecutivo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/auth/registro:
    post:
      summary: "Crear una cuenta ciudadana. La respuesta es la MISMA exista o no ese
        correo: no revela quién tiene cuenta. No inicia sesión (devolver cookie
        solo en el caso nuevo delataría lo anterior). El rol siempre es
        «ciudadano» y no se puede pedir otro."
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registro"
      responses:
        "201":
          description: CUENTA_LISTA. Respuesta idéntica para correo nuevo y correo ya
            existente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "400":
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "429":
          description: "DEMASIADAS_CUENTAS: demasiadas altas desde la misma IP, por hora o
            por el tope de 10 altas por día calendario (ALTAS_POR_DIA_POR_IP),
            contado en la base"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/auth/login:
    post:
      summary: Iniciar sesión (ciudadano, técnico, admin o ejecutivo)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Sesión creada (cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/auth/logout:
    post:
      summary: Cerrar sesión
      tags:
        - auth
      security: *a1
      responses:
        "204":
          description: Sesión cerrada
  /api/v1/configuracion:
    get:
      summary: "Configuración pública del despliegue: la ciudad (nombre, país, zona
        horaria, locale, centro y zoom inicial del mapa). Mi Curichi se
        despliega una vez por ciudad con la misma imagen, y los clientes leen
        esto en tiempo de ejecución en vez de fijarlo al compilar. Pública y sin
        sesión."
      tags:
        - configuracion
      responses:
        "200":
          description: Configuración de la ciudad
          headers:
            Cache-Control:
              description: "public: la respuesta es la misma para cualquiera que pregunte y
                solo cambia al reconfigurar el despliegue, así que la puede
                guardar cualquier caché."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguracionPublica"
  /api/v1/auth/yo:
    get:
      summary: "Usuario de la sesión, más reportes_restantes_hoy (de 3 por día
        calendario en la zona horaria de la ciudad) y puede_reportar_desde: null
        si puede reportar ahora, o la próxima medianoche local si ya no le
        quedan reportes hoy. Además demora_proximo_s: cuánto tardaría en
        publicarse el próximo reporte (60 s si es el 1.º del día, 240 s si no),
        para avisarlo antes de enviar. Es información para la interfaz; el cupo
        lo aplica el servidor al crear. Para tecnico, admin y ejecutivo lleva
        además panel_url: la URL base del panel, o null si el despliegue no la
        configuró. Al ciudadano no se le manda nunca."
      tags:
        - auth
      security: *a1
      responses:
        "200":
          description: Usuario y estado de su cuota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionActual"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /api/v1/admin/capas:
    get:
      summary: Versiones de capas cargadas
      tags:
        - admin
      security: *a1
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapaVersion"
  /api/v1/admin/capas/{id}/activar:
    post:
      summary: Activar una versión de capa como vigente
      tags:
        - admin
      security: *a1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapaVersion"
  /geo/v1/resolver:
    post:
      summary: "Point-in-polygon: distrito y UV de un punto (§7.4)"
      tags:
        - geo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolverEntrada"
      responses:
        "200":
          description: Resolución
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolverRespuesta"
  /geo/v1/capas/vigentes:
    get:
      summary: Versión vigente por capa
      tags:
        - geo
      responses:
        "200":
          description: Mapa capa → versión
          headers:
            Cache-Control:
              description: "public, no-cache: se guarda, pero se revalida en cada uso"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapasVigentes"
  /geo/v1/capas:
    get:
      summary: "Información de las capas vigentes (modo GeoJSON o teselas), con la url
        que tienen que usar los clientes: lleva la huella del contenido servido"
      tags:
        - geo
      responses:
        "200":
          description: Lista
          headers:
            Cache-Control:
              description: "public, no-cache: se guarda, pero se revalida en cada uso. Es la
                que dice cuál es la huella vigente: el cliente la vuelve a pedir
                ante un 410 CAPA_CAMBIO"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapaInfo"
  /geo/v1/capas/{capa}/v/{huella}:
    get:
      summary: GeoJSON web de la capa vigente, en la URL con huella que da
        CapaInfo.url (desde 0.12.0). Si la huella no es la vigente responde 410
        y el cliente vuelve a pedir /geo/v1/capas
      tags:
        - geo
      parameters:
        - name: capa
          in: path
          required: true
          schema:
            type: string
            enum:
              - distrito_municipal
              - unidad_vecinal
              - manzana
        - name: huella
          in: path
          required: true
          description: Primeros 16 caracteres hexadecimales del SHA-256 del GeoJSON web
            servido (HuellaCapaSchema)
          schema:
            type: string
            pattern: ^[0-9a-f]{16}$
      responses:
        "200":
          description: FeatureCollection (application/geo+json)
          headers:
            Cache-Control:
              description: "public, max-age=31536000, immutable: la URL lleva la huella del
                contenido, así que no cambia mientras exista"
              schema:
                type: string
            ETag:
              description: Del contenido servido
              schema:
                type: string
        "304":
          description: No cambió (If-None-Match)
        "404":
          description: Capa desconocida o sin versión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "410":
          description: "CAPA_CAMBIO: la huella ya no es la vigente (la capa se activó o se
            recargó). Va con Cache-Control: no-store; el cliente vuelve a pedir
            /geo/v1/capas y usa la url nueva"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "413":
          description: "USAR_TESELAS: la capa supera UMBRAL_TESELAS_BYTES y se consume por
            teselas"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /geo/v1/capas/{capa}:
    get:
      summary: "Alias sin huella de /geo/v1/capas/{capa}/v/{huella}: la capa vigente,
        sin cachear de más. Los clientes usan CapaInfo.url"
      tags:
        - geo
      parameters:
        - name: capa
          in: path
          required: true
          schema:
            type: string
            enum:
              - distrito_municipal
              - unidad_vecinal
              - manzana
      responses:
        "200":
          description: FeatureCollection (application/geo+json)
          headers:
            Cache-Control:
              description: "public, no-cache: se guarda, pero se revalida en cada uso"
              schema:
                type: string
            ETag:
              description: Del contenido servido
              schema:
                type: string
        "304":
          description: No cambió (If-None-Match)
        "404":
          description: Capa desconocida o sin versión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "413":
          description: USAR_TESELAS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /geo/v1/teselas/{capa}/{huella}/{z}/{x}/{y}.mvt:
    get:
      summary: "Teselas vectoriales generadas al vuelo desde la capa vigente, en la
        plantilla con huella que da CapaInfo.url en modo teselas (desde 0.12.0).
        La huella es la de la capa: la del GeoJSON del que salen las teselas"
      tags:
        - geo
      parameters:
        - name: capa
          in: path
          required: true
          schema:
            type: string
            enum:
              - distrito_municipal
              - unidad_vecinal
              - manzana
        - name: huella
          in: path
          required: true
          description: Primeros 16 caracteres hexadecimales del SHA-256 del GeoJSON web
            servido (HuellaCapaSchema)
          schema:
            type: string
            pattern: ^[0-9a-f]{16}$
        - name: z
          in: path
          required: true
          schema:
            type: integer
        - name: x
          in: path
          required: true
          schema:
            type: integer
        - name: y
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: application/vnd.mapbox-vector-tile
          headers:
            Cache-Control:
              description: "public, max-age=31536000, immutable: la URL lleva la huella del
                contenido, así que no cambia mientras exista"
              schema:
                type: string
            ETag:
              description: Del contenido servido
              schema:
                type: string
        "204":
          description: Tesela vacía
        "304":
          description: No cambió (If-None-Match)
        "400":
          description: Tesela inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "404":
          description: Capa desconocida o sin versión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "410":
          description: "CAPA_CAMBIO: la huella ya no es la vigente (la capa se activó o se
            recargó). Va con Cache-Control: no-store; el cliente vuelve a pedir
            /geo/v1/capas y usa la url nueva"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /geo/v1/teselas/{capa}/{z}/{x}/{y}.mvt:
    get:
      summary: "Alias sin huella de /geo/v1/teselas/{capa}/{huella}/{z}/{x}/{y}.mvt:
        teselas de la capa vigente, sin cachear de más. Los clientes usan
        CapaInfo.url"
      tags:
        - geo
      parameters:
        - name: capa
          in: path
          required: true
          schema:
            type: string
            enum:
              - distrito_municipal
              - unidad_vecinal
              - manzana
        - name: z
          in: path
          required: true
          schema:
            type: integer
        - name: x
          in: path
          required: true
          schema:
            type: integer
        - name: y
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: application/vnd.mapbox-vector-tile
          headers:
            Cache-Control:
              description: "public, no-cache: se guarda, pero se revalida en cada uso"
              schema:
                type: string
            ETag:
              description: Del contenido servido
              schema:
                type: string
        "204":
          description: Tesela vacía
        "304":
          description: No cambió (If-None-Match)
        "400":
          description: Tesela inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "404":
          description: Capa desconocida o sin versión vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
  /geo/v1/agregados/unidades-vecinales:
    get:
      summary: "Reportes publicados por UV (nuevo como «NO SE HA VERIFICADO», validado
        como «Verificado» y resuelto como «Resuelto», solo con publicar_en <=
        now(); rechazado y duplicado no se publican), con n_verificados y
        severidad_max_verificada, que solo cuentan validado y resuelto: la
        coropleta pública usa severidad_max_verificada y pinta neutra la UV que
        solo tiene reportes sin verificar. Los puntos críticos se arman solo con
        verificados."
      tags:
        - geo
      responses:
        "200":
          description: Lista
          headers:
            Cache-Control:
              description: public, no-cache. geo-service las calcula como mucho cada 100 s
                (GEO_CACHE_AGREGADOS_MS) y nunca sirve cifras de más de 120 s
                (GEO_CACHE_AGREGADOS_EDAD_MAX_MS)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgregadoUv"
  /geo/v1/puntos-criticos:
    get:
      summary: Puntos críticos (§9.2), armados solo con reportes verificados
      tags:
        - geo
      parameters:
        - name: bbox
          in: query
          required: false
          schema:
            type: string
          description: minLon,minLat,maxLon,maxLat
      responses:
        "200":
          description: Lista
          headers:
            Cache-Control:
              description: public, no-cache. geo-service las calcula como mucho cada 100 s
                (GEO_CACHE_AGREGADOS_MS) y nunca sirve cifras de más de 120 s
                (GEO_CACHE_AGREGADOS_EDAD_MAX_MS)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PuntoCritico"
  /health:
    get:
      summary: Liveness
      tags:
        - admin
      responses:
        "200":
          description: ok
  /ready:
    get:
      summary: "Readiness de api-core: la base, el /health de geo-service y el almacén
        de fotos (con S3, que responda; en disco, que se pueda escribir y que
        quede espacio por encima de FOTOS_MIN_LIBRE_BYTES). geo-service tiene su
        propio /ready, que solo mira PostGIS."
      tags:
        - admin
      responses:
        "200":
          description: "Lista para atender. Con geo-service caído o las fotos en 'error' o
            'poco_espacio', degradado: true, pero sigue en rotación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyApiCore"
        "503":
          description: "Sin base de datos: la réplica sale de rotación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyApiCore"
