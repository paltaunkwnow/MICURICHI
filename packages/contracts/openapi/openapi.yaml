      summary: "Crear un reporte. EXIGE SESIÓN (cualquier rol). El autor se toma de la
        sesión: el cuerpo no tiene ni puede tener un campo de autor. El cuerpo
        lleva la posición del teléfono al enviar (dispositivo), y el punto tiene
        que estar a 60 m o menos de ella. La posición del dispositivo no se
        guarda, no se registra en logs ni en auditoría y no entra en la huella
        de idempotencia: queda solo la distancia redondeada. ubicacion_metodo y
        precision_gps_m los deriva el servidor. Además del rate limit por IP,
        cada cuenta puede crear 3 reportes por día calendario en la zona horaria
        de la ciudad, contados en la base. El reporte queda en nuevo y se
        publica sin moderación previa, como «NO SE HA VERIFICADO», cuando llega
        su publicar_en: 60 s después de crearlo si es el 1.º del día de la
        cuenta, 240 s si es el 2.º o el 3.º. Lo fija el servidor al crear y
        ningún cliente lo puede adelantar; mientras espera no lo ve nadie más
        que su autor, técnicos incluidos."
      tags:
        - reportes
      security: &a1
        - cookieSesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReporteCrear"
      responses:
        "200":
          description: "Replay de un envío con la misma Idempotency-Key de la misma cuenta
            (cabecera Idempotent-Replay: true): el reporte ya creado, con el
            mismo publicar_en y los segundos que le quedan ahora. No gasta cupo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiReporteFeature"
        "201":
          description: "Reporte creado en estado nuevo, en la vista del autor: publicar_en
            y segundos_para_publicar, calculados en la base (la cuenta regresiva
            de la interfaz parte de acá)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiReporteFeature"
        "400":
          description: "PAYLOAD_INVALIDO. Además del formato: dispositivo ausente o fuera
            de sus rangos físicos (precision_m de 0 a 10 000, antiguedad_s ≥ 0),
            evento_en con más de 10 min de adelanto o más de 365 días de
            antigüedad, y respuestas del sumidero incoherentes (con
            sumidero_cercano = no, sin sumidero_estado ni agua_brota_sumidero =
            true)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "401":
          description: "SIN_SESION: hay que iniciar sesión para reportar"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "422":
          description: "PRECISION_INSUFICIENTE: dispositivo.precision_m mayor a 50 m.
            POSICION_VENCIDA: dispositivo.antiguedad_s mayor a 600 s.
            UBICACION_FUERA_DE_RADIO: el punto está a más de 60,5 m de
            dispositivo (el radio de 60 m más 0,5 m de tolerancia por el
            redondeo de las coordenadas; la interfaz recorta el punto al radio
            sin tolerancia). Esos tres se comprueban en ese orden, después de
            validar el cuerpo y antes de resolver la ubicación, y no gastan
            cupo. FUERA_DE_COBERTURA: el punto no cae en el municipio"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "429":
          description: "CUOTA_DE_REPORTES: la cuenta ya creó sus 3 reportes de hoy (día
            calendario en la zona horaria de la ciudad), con el mensaje «Ya
            enviaste los 3 reportes de hoy. Vas a poder enviar otro mañana.» y
            Retry-After con los segundos que faltan hasta la próxima medianoche
            local. O rate limit por IP, también con Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
    get:
