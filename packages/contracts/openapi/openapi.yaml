# GENERADO por packages/contracts/scripts/generar.ts — no editar a mano
openapi: 3.1.0
info:
  title: Mi Curichi — API
  version: 1.0.0
  description: Reporte ciudadano georreferenciado de puntos de inundación.
    Contrato generado desde packages/contracts (Zod). Severidad versión 2; radio
    de recurrencia 25 m.
servers:
  - url: http://localhost:3001
    description: api-core local
  - url: http://localhost:3002
    description: geo-service local
tags:
  - name: reportes
    description: api-core (Parte 3)
  - name: fotos
    description: api-core (Parte 3)
  - name: auth
    description: api-core (Parte 3)
  - name: admin
    description: api-core (Parte 3)
  - name: ejecutivo
    description: api-core (Parte 3)
  - name: configuracion
    description: api-core (Parte 3)
  - name: geo
    description: geo-service (Parte 4)
components:
  schemas:
    ErrorApi:
      type: object
      properties:
        codigo:
          type: string
          description: Código estable, p. ej. FUERA_DE_COBERTURA
        mensaje:
          type: string
        detalles: {}
      required:
        - codigo
        - mensaje
    ReporteCrear:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitud WGS84 (EPSG:4326)
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Longitud WGS84 (EPSG:4326)
        dispositivo:
          type: object
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
              description: Latitud WGS84 (EPSG:4326)
            lon:
              type: number
              minimum: -180
              maximum: 180
              description: Longitud WGS84 (EPSG:4326)
            precision_m:
              type: number
              minimum: 0
              maximum: 10000
              description: Precisión que declara el dispositivo (Geolocation coords.accuracy),
                en metros. Se aceptan 50 m o menos (422 PRECISION_INSUFICIENTE)
            antiguedad_s:
              type: number
              minimum: 0
              description: Segundos entre la lectura de la posición y el envío; 0 si el reloj
                la da en el futuro. Se aceptan 600 s o menos (422
                POSICION_VENCIDA)
          required:
            - lat
            - lon
            - precision_m
            - antiguedad_s
          description: Posición del dispositivo al enviar. El punto del reporte tiene que
            estar a 60 m o menos (422 UBICACION_FUERA_DE_RADIO). No se guarda
        ubicacion_tipo:
          type: string
          enum:
            - via_publica
            - vivienda_o_predio
            - otro
        descripcion:
          type: string
          minLength: 10
          maxLength: 1000
        profundidad_estimada:
          type: string
          enum:
            - tobillo
            - rodilla
            - muslo
            - mas_70
        frecuencia:
          type: string
          enum:
            - primera_vez
            - ocasional
            - cada_lluvia_fuerte
            - permanente
            - agua_estancada
        causa_presunta:
          default: desconocida
          type: string
          enum:
            - sumidero_tapado
            - falta_sumidero
            - hundimiento_pavimento
            - contrapendiente
            - colector_saturado
            - desborde_cauce
            - desconocida
        sumidero_cercano:
          anyOf:
            - type: string
              enum:
                - si
                - no
            - type: "null"
        sumidero_estado:
          anyOf:
            - type: string
              enum:
                - tapado
                - no_tapado
            - type: "null"
        agua_brota_sumidero:
          type:
            - boolean
            - "null"
        evento_en:
          description: Cuándo ocurrió el anegamiento; null = se asume creado_en. Entre 365
            días atrás y 10 minutos adelante del reloj del servidor.
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            - type: "null"
        fotos:
          default: []
          maxItems: 3
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        sitio_web:
          type: string
          maxLength: 0
      required:
        - lat
        - lon
        - dispositivo
        - ubicacion_tipo
        - descripcion
        - profundidad_estimada
        - frecuencia
    ReporteFiltros:
      type: object
      properties:
        pagina:
          default: 1
          type: integer
          minimum: 1
          maximum: 9007199254740991
        limite:
          default: 100
          type: integer
          minimum: 1
          maximum: 500
        bbox:
          description: minLon,minLat,maxLon,maxLat
          type: string
          pattern: ^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$
        estado:
          anyOf:
            - type: string
              enum:
                - nuevo
                - validado
                - duplicado
                - rechazado
                - resuelto
            - type: array
