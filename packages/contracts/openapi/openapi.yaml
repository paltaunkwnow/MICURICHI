        "400":
          description: "PAYLOAD_INVALIDO: p. ej. falta estado_motivo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "401":
          description: SIN_SESION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApi"
        "403":
          description: "SIN_PERMISO: el rol no puede moderar, o la transición existe pero
