# Pruebas de las alertas con `promtool test rules`: la entrada (apps y proxy), el disco de fotos y
# la bandeja sin verificar. Parte 5.
#
#   docker run --rm --network none -v "$PWD/infra/observabilidad:/etc/prometheus:ro" \
#     --entrypoint /bin/promtool quay.io/prometheus/prometheus:v3.15.0@sha256:… \
#     test rules /etc/prometheus/alertas.test.yml
#
# Se mira la serie ALERTS (qué alerta queda «firing» y con qué etiquetas) y no las anotaciones:
# cambiar la redacción de una descripción no tiene por qué romper una prueba. El reloj de promtool
# empieza en 0, así que `time()` vale los segundos transcurridos desde el inicio de la prueba.
rule_files:
  - alertas.yml

evaluation_interval: 1m

tests:
  # Una réplica de la app pública cae y la otra sigue: AppCaida de esa réplica, sin AppSinReplicas.
  # El panel tiene una sola réplica y cae: AppCaida y AppSinReplicas (que inhibe su ProxyNoResponde).
  - interval: 1m
    input_series:
      - series: 'probe_success{job="apps", servicio="web-ciudadano", instance="http://172.18.0.6:3000/"}'
        values: '1 1 0 0 0 0 0'
      - series: 'probe_success{job="apps", servicio="web-ciudadano", instance="http://172.18.0.8:3000/"}'
        values: '1 1 1 1 1 1 1'
      - series: 'probe_success{job="apps", servicio="panel-admin", instance="http://172.18.0.7:3100/"}'
        values: '1 1 0 0 0 0 0'
      - series: 'probe_success{job="proxy", instance="mapa.ejemplo.org", sitio="publica", app="web-ciudadano", tls="acme"}'
        values: '1 1 1 1 1 1 1'
      - series: 'probe_success{job="proxy", instance="panel.ejemplo.org", sitio="panel", app="panel-admin", tls="acme"}'
        values: '1 1 0 0 0 0 0'
    promql_expr_test:
      # A los 3 minutos de fallar todavía no pasaron los 2 de `for` en la evaluación anterior: pendiente.
      - expr: ALERTS{alertname="AppCaida"}
        eval_time: 3m
        exp_samples:
          - labels: 'ALERTS{alertname="AppCaida", alertstate="pending", app="web-ciudadano", gravedad="critica", instance="http://172.18.0.6:3000/", job="apps", servicio="web-ciudadano"}'
            value: 1
          - labels: 'ALERTS{alertname="AppCaida", alertstate="pending", app="panel-admin", gravedad="critica", instance="http://172.18.0.7:3100/", job="apps", servicio="panel-admin"}'
            value: 1
      - expr: ALERTS{alertname="AppCaida", alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="AppCaida", alertstate="firing", app="web-ciudadano", gravedad="critica", instance="http://172.18.0.6:3000/", job="apps", servicio="web-ciudadano"}'
            value: 1
          - labels: 'ALERTS{alertname="AppCaida", alertstate="firing", app="panel-admin", gravedad="critica", instance="http://172.18.0.7:3100/", job="apps", servicio="panel-admin"}'
            value: 1
      # La pública conserva una réplica sana: solo el panel se queda sin ninguna.
      - expr: ALERTS{alertname="AppSinReplicas", alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="AppSinReplicas", alertstate="firing", app="panel-admin", gravedad="critica", servicio="panel-admin"}'
            value: 1
      # La entrada del panel falla por el proxy; la pública, no. Misma `app` que AppSinReplicas.
      - expr: ALERTS{alertname="ProxyNoResponde", alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="ProxyNoResponde", alertstate="firing", app="panel-admin", gravedad="critica", instance="panel.ejemplo.org", job="proxy", servicio="proxy", sitio="panel", tls="acme"}'
            value: 1

  # Ninguna réplica de la app pública descubierta (DNS vacío): AppSinReplicas igual.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="apps", servicio="panel-admin", instance="http://172.18.0.7:3100/"}'
        values: '1 1 1 1 1'
    promql_expr_test:
      - expr: ALERTS{alertname="AppSinReplicas", alertstate="firing"}
        eval_time: 4m
        exp_samples:
          - labels: 'ALERTS{alertname="AppSinReplicas", alertstate="firing", app="web-ciudadano", gravedad="critica", servicio="web-ciudadano"}'
            value: 1

  # Certificados: 5 días con ACME avisa; 60 días con ACME, no; y con la CA interna (certificados de
  # horas) no avisa nunca. Los valores son el vencimiento en segundos desde el inicio de la prueba.
  # Una muestra por minuto: con huecos de más de 5 min la serie «desaparece» y el `for` se reinicia.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="proxy", instance="mapa.ejemplo.org", sitio="publica", app="web-ciudadano", tls="acme"}'
        values: '432000x150'
      - series: 'probe_ssl_earliest_cert_expiry{job="proxy", instance="panel.ejemplo.org", sitio="panel", app="panel-admin", tls="acme"}'
        values: '5184000x150'
      - series: 'probe_ssl_earliest_cert_expiry{job="proxy", instance="mapa.local", sitio="publica", app="web-ciudadano", tls="interno"}'
        values: '43200x150'
    promql_expr_test:
      - expr: ALERTS{alertname="CertificadoPorVencer"}
        eval_time: 30m
        exp_samples:
          - labels: 'ALERTS{alertname="CertificadoPorVencer", alertstate="pending", app="web-ciudadano", gravedad="alta", instance="mapa.ejemplo.org", job="proxy", servicio="proxy", sitio="publica", tls="acme"}'
            value: 1
      - expr: ALERTS{alertname="CertificadoPorVencer"}
        eval_time: 2h
        exp_samples:
          - labels: 'ALERTS{alertname="CertificadoPorVencer", alertstate="firing", app="web-ciudadano", gravedad="alta", instance="mapa.ejemplo.org", job="proxy", servicio="proxy", sitio="publica", tls="acme"}'
            value: 1

  # Disco de fotos. Dos réplicas de api-core leen el mismo volumen: una sola alerta por servicio.
  # El umbral es el que api-core publica en curichi_fotos_disco_min_libre_bytes (aquí el valor por
  # defecto de FOTOS_MIN_LIBRE_BYTES, 2 GiB). 5 GiB libres hasta el minuto 4, 3 GiB (menos del
  # doble del umbral) del 5 al 45 y 1 GiB (bajo el umbral: api-core ya responde 507) del 46 en
  # adelante.
  - interval: 1m
    input_series:
      - series: 'curichi_fotos_disco_libre_bytes{job="api-core", instance="172.18.0.5:3001"}'
        values: '5368709120x4 3221225472x40 1073741824x20'
      - series: 'curichi_fotos_disco_libre_bytes{job="api-core", instance="172.18.0.9:3001"}'
        values: '5368709120x4 3221225472x40 1073741824x20'
      - series: 'curichi_fotos_disco_min_libre_bytes{job="api-core", instance="172.18.0.5:3001"}'
        values: '2147483648x64'
      - series: 'curichi_fotos_disco_min_libre_bytes{job="api-core", instance="172.18.0.9:3001"}'
        values: '2147483648x64'
    promql_expr_test:
      - expr: ALERTS{alertname=~"DiscoDeFotos.*"}
        eval_time: 4m
      - expr: ALERTS{alertname=~"DiscoDeFotos.*"}
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="DiscoDeFotosPorLlenarse", alertstate="pending", gravedad="alta", job="api-core", servicio="api-core"}'
            value: 1
      - expr: ALERTS{alertname=~"DiscoDeFotos.*"}
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="DiscoDeFotosPorLlenarse", alertstate="firing", gravedad="alta", job="api-core", servicio="api-core"}'
            value: 1
      # Bajo el umbral avisa la crítica y la de «por llenarse» se resuelve: no se avisan las dos.
      - expr: ALERTS{alertname=~"DiscoDeFotos.*"}
        eval_time: 55m
        exp_samples:
          - labels: 'ALERTS{alertname="DiscoDeFotosBajoElUmbral", alertstate="firing", gravedad="critica", job="api-core", servicio="api-core"}'
            value: 1

  # Otro FOTOS_MIN_LIBRE_BYTES (8 GiB): las alertas siguen al umbral que publica api-core, sin
  # tocar alertas.yml. 20 GiB libres hasta el minuto 4, 12 GiB (menos de 16) del 5 al 45 y 6 GiB
  # del 46 en adelante. Con 2 GiB escritos a mano no avisaría ninguna.
  - interval: 1m
    input_series:
      - series: 'curichi_fotos_disco_libre_bytes{job="api-core", instance="172.18.0.5:3001"}'
        values: '21474836480x4 12884901888x40 6442450944x20'
      - series: 'curichi_fotos_disco_min_libre_bytes{job="api-core", instance="172.18.0.5:3001"}'
        values: '8589934592x64'
    promql_expr_test:
      - expr: ALERTS{alertname=~"DiscoDeFotos.*"}
        eval_time: 4m
      - expr: ALERTS{alertname=~"DiscoDeFotos.*"}
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="DiscoDeFotosPorLlenarse", alertstate="firing", gravedad="alta", job="api-core", servicio="api-core"}'
            value: 1
      - expr: ALERTS{alertname=~"DiscoDeFotos.*"}
        eval_time: 55m
        exp_samples:
          - labels: 'ALERTS{alertname="DiscoDeFotosBajoElUmbral", alertstate="firing", gravedad="critica", job="api-core", servicio="api-core"}'
            value: 1

  # FOTOS_MIN_LIBRE_BYTES=0 apaga la guarda en api-core, y con ella estas alertas: 1 GiB libre no
  # avisa.
  - interval: 1m
    input_series:
      - series: 'curichi_fotos_disco_libre_bytes{job="api-core", instance="172.18.0.5:3001"}'
        values: '1073741824x60'
      - series: 'curichi_fotos_disco_min_libre_bytes{job="api-core", instance="172.18.0.5:3001"}'
        values: '0x60'
    promql_expr_test:
      - expr: ALERTS{alertname=~"DiscoDeFotos.*"}
        eval_time: 50m

  # Bandeja sin verificar: el reporte más antiguo sin verificar cumple 23 h en el minuto 0 y
  # envejece 60 s por minuto; pasa las 24 h en el minuto 61 y en el 121 un técnico lo revisa (0).
  # Con dos réplicas que leen la misma base, una sola alerta.
  - interval: 1m
    input_series:
      - series: 'curichi_reportes_sin_verificar_antiguedad_segundos{job="api-core", instance="172.18.0.5:3001"}'
        values: '82800+60x120 0x10'
      - series: 'curichi_reportes_sin_verificar_antiguedad_segundos{job="api-core", instance="172.18.0.9:3001"}'
        values: '82800+60x120 0x10'
    promql_expr_test:
      - expr: ALERTS{alertname="BandejaSinVerificarAtrasada"}
        eval_time: 60m
      - expr: ALERTS{alertname="BandejaSinVerificarAtrasada"}
        eval_time: 65m
        exp_samples:
          - labels: 'ALERTS{alertname="BandejaSinVerificarAtrasada", alertstate="pending", gravedad="alta", job="api-core", servicio="api-core"}'
            value: 1
      - expr: ALERTS{alertname="BandejaSinVerificarAtrasada"}
        eval_time: 80m
        exp_samples:
          - labels: 'ALERTS{alertname="BandejaSinVerificarAtrasada", alertstate="firing", gravedad="alta", job="api-core", servicio="api-core"}'
            value: 1
      - expr: ALERTS{alertname="BandejaSinVerificarAtrasada"}
        eval_time: 125m
